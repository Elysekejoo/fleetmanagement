<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fleet Management &amp; GPS Tracking System — MSH Rwanda</title>
    <meta
      name="description"
      content="Fleet Management and GPS Tracking System for MSH Rwanda. Manage vehicles, travel requests, drivers, fuel and maintenance records, and live fleet visibility."
    />
    <meta name="theme-color" content="#0B1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fleet FMS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html,
      body {
        background: #0b1628;
      }
      #fms-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b1628;
      }
      #fms-preloader img {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }
      .fms-preloader__spinner {
        margin-top: 32px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(245, 180, 0, 0.25);
        border-top-color: #f5b400;
        animation: fms-spin 0.8s linear infinite;
      }
      #fms-preloader p {
        margin-top: 20px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      @keyframes fms-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fms-preloader__spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <div id="fms-preloader" aria-hidden="true">
      <img src="/icons/icon-512.png" alt="" draggable="false" />
      <div class="fms-preloader__spinner" role="status" aria-label="Loading"></div>
      <p>MSH RWANDA</p>
    </div>
    <script>
      (function () {
        var pre = document.getElementById('fms-preloader');
        if (!pre) return;
        window.addEventListener('fms-preloader-done', function () {
          pre.remove();
        });
        setTimeout(function () {
          pre.remove();
        }, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
